[project]
name = "sales-agent"
version = "0.1.0"
description = "Diarized transcription using Whisper + pyannote.audio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["transcription", "diarization", "whisper", "pyannote", "speech-to-text"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.1.0",
    "pyannote-audio>=3.4.0",
    "soundfile>=0.13.0",
    "librosa>=0.10.0",
    "numpy>=1.26.0",
    "rich>=13.0.0",
    "noisereduce>=3.0.3",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
transcribe = "sales_agent.cli:main"

[project.urls]
Homepage = "https://github.com/username/sales-agent"
Repository = "https://github.com/username/sales-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
