[project]
name = "whisper-diarize"
version = "0.1.0"
description = "Diarized transcription using Whisper + pyannote.audio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["transcription", "diarization", "whisper", "pyannote", "speech-to-text"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.1.0",
    "pyannote-audio>=4.0.0",
    "soundfile>=0.13.0",
    "librosa>=0.10.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "noisereduce>=3.0.3",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[project.scripts]
transcribe = "whisper_diarize.cli:main"

[project.urls]
Homepage = "https://github.com/chrishart0/transcribe-from-audio"
Repository = "https://github.com/chrishart0/transcribe-from-audio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["AGENTS.md", "CLAUDE.md", "PUBLISHING.md", ".pre-commit-config.yaml", ".github/"]

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_diarize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["**/__pycache__"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
